<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Estoque</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    background:#f3f6fb;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.login-container{

    width:100%;
    max-width:430px;

    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,0.08);

}

.logo{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    margin-bottom:30px;
}

.logo-icon{

    width:50px;
    height:50px;

    background:#1e3a5f;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:24px;
}

.logo h1{
    color:#1e3a5f;
    font-size:24px;
}

.subtitle{

    text-align:center;

    color:#64748b;

    margin-bottom:35px;
}

.form-group{
    margin-bottom:22px;
}

.form-group label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

    color:#334155;
}

.form-group input{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:1px solid #dbe2ea;

    outline:none;

    font-size:15px;

    transition:0.2s;
}

.form-group input:focus{

    border-color:#3c6eaf;

    box-shadow:0 0 0 4px rgba(60,110,175,0.12);
}

/* SENHA */

.password-wrapper{
    position:relative;
}

.password-wrapper input{
    padding-right:50px;
}

.toggle-password{

    position:absolute;

    right:15px;

    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    color:#64748b;

    font-size:18px;

    user-select:none;
}

.toggle-password:hover{
    color:#1e3a5f;
}

/* ERRO */

.error-message{

    background:#fff1f1;

    border:1px solid #ffb3b3;

    color:#c53030;

    padding:14px;

    border-radius:12px;

    margin-bottom:20px;

    font-size:14px;

    text-align:center;
}

/* BOTÃO */

.btn-login{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#1e3a5f;

    color:white;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:0.2s;
}

.btn-login:hover{
    background:#274a77;
}

.register-link{

    margin-top:25px;

    text-align:center;
}

.register-link a{

    text-decoration:none;

    color:#1e3a5f;

    font-weight:600;
}

.register-link a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="login-container">

    <div class="logo">

        <h1>Super Estoque</h1>

    </div>

    <p class="subtitle">
        Acesse sua conta
    </p>

    <form method="post">

        {% csrf_token %}

        <div class="form-group">

            <label>Usuário</label>

            <input
                type="text"
                name="username"
                placeholder="Digite seu usuário"
                required
            >

        </div>

        <div class="form-group">

            <label>Senha</label>

            <div class="password-wrapper">

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Digite sua senha"
                    required
                >

                <span
                    class="toggle-password"
                    onclick="togglePassword()"
                >
                    👁
                </span>

            </div>

        </div>

        <!-- MENSAGEM DE ERRO -->

        {% if erro %}

            <div class="error-message">
                {{ erro }}
            </div>

        {% endif %}

        <button type="submit" class="btn-login">
            Entrar
        </button>

    </form>

    <div class="register-link">

        <a href="/registro/">
            Criar conta
        </a>

    </div>

</div>

<script>

function togglePassword(){

    const input = document.getElementById("password");

    if(input.type === "password"){

        input.type = "text";

    }else{

        input.type = "password";

    }

}

</script>

</body>

</html>
