<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Super Estoque</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter', sans-serif;
            background:#f4f6f9;
            color:#1f2937;
        }

        /* HEADER */

        .header{

            width:100%;
            height:75px;

            background:white;

            border-bottom:1px solid #dce3ea;

            display:flex;
            align-items:center;
            justify-content:space-between;

            padding:0 40px;
        }

        /* LOGO */

        .logo{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .logo-icon{

            width:45px;
            height:45px;

            background:#1e3a5f;

            border-radius:12px;

            display:flex;
            align-items:center;
            justify-content:center;

            color:white;

            font-size:22px;
        }

        .logo h1{

            font-size:20px;
            color:#1e3a5f;
        }

        /* AÇÕES HEADER */

        .header-actions{

            display:flex;
            align-items:center;
            gap:12px;
        }

        /* BOTÕES */

        .header-btn{

            padding:12px 18px;

            border:none;

            border-radius:10px;

            cursor:pointer;

            text-decoration:none;

            font-weight:600;

            transition:0.2s;

            display:flex;
            align-items:center;
            gap:8px;
        }

        .header-btn:hover{
            transform:translateY(-2px);
        }

        .btn-menu{

            background:#edf2f7;
            color:#1f2937;
        }

        .btn-profile{

            background:#1e3a5f;
            color:white;
        }

        .btn-logout{

            background:#d64545;
            color:white;
        }

        /* PAGE */

        .page{

            width:95%;
            max-width:1400px;

            margin:35px auto;
        }

        /* CARD */

        .card{

            background:white;

            border-radius:18px;

            padding:25px;

            box-shadow:0 4px 15px rgba(0,0,0,0.05);
        }

        /* BOTÕES GERAIS */

        .btn{

            padding:12px 18px;

            border:none;

            border-radius:10px;

            cursor:pointer;

            font-weight:600;

            text-decoration:none;

            display:inline-flex;
            align-items:center;
            gap:8px;

            transition:0.2s;
        }

        .btn:hover{
            transform:translateY(-2px);
        }

        .btn-primary{
            background:#1e3a5f;
            color:white;
        }

        .btn-success{
            background:#2ea44f;
            color:white;
        }

        .btn-danger{
            background:#d64545;
            color:white;
        }

        .btn-light{
            background:#edf2f7;
            color:#1f2937;
        }

        /* INPUTS */

        .input{

            width:100%;

            padding:14px;

            border-radius:10px;

            border:1px solid #dce3ea;

            outline:none;

            font-size:15px;
        }

        .input:focus{
            border-color:#3c6eaf;
        }

        /* TABELAS */

        .table{
            width:100%;
            border-collapse:collapse;
        }

        .table thead{
            background:#f8fafc;
        }

        .table th{

            text-align:left;

            padding:16px;

            color:#64748b;

            font-weight:600;

            border-bottom:1px solid #e2e8f0;
        }

        .table td{

            padding:16px;

            border-bottom:1px solid #edf2f7;
        }

        .table tr:hover{
            background:#f9fbfd;
        }

        /* TÍTULOS */

        .page-title{

            font-size:28px;

            margin-bottom:25px;

            color:#1e3a5f;
        }

        .top-actions{

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-bottom:25px;
        }

        /* DASHBOARD */

        .dashboard{

            display:grid;

            grid-template-columns:repeat(auto-fit,minmax(240px,1fr));

            gap:20px;
        }

        .dashboard-card{

            background:white;

            border-radius:18px;

            padding:25px;

            box-shadow:0 4px 15px rgba(0,0,0,0.05);

            text-decoration:none;

            transition:0.3s;
        }

        .dashboard-card:hover{
            transform:translateY(-5px);
        }

        .dashboard-card h3{

            color:#64748b;

            margin-bottom:10px;
        }

        .dashboard-card p{
            font-size:35px;
        }

    </style>

</head>

<body>

<div class="header">

    <!-- LOGO -->

    <div class="logo">

        <!-- <div class="logo-icon">
            📦
        </div> -->

        <h1>Super Estoque</h1>

    </div>

    <!-- BOTÕES -->

    {% if user.is_authenticated %}

    <div class="header-actions">

        <!-- MENU -->

        {% if request.resolver_match.url_name != 'menu' %}

        <a href="{% url 'menu' %}" class="header-btn btn-menu">
            Voltar ao Menu
        </a>

        {% endif %}

        <!-- PERFIL -->

        <a href="/perfil/" class="header-btn btn-profile">
            Meu Perfil
        </a>

        <!-- SAIR -->

        <a href="/logout/" class="header-btn btn-logout">
            Sair
        </a>

    </div>

    {% endif %}

</div>

<div class="page">

    {% block content %}
    {% endblock %}

</div>

</body>

</html>
